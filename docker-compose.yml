services:
  mysterio:
    build: .
    ports:
      - "9999:8080"
    environment:
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      ELASTIC_ENABLED: ${ELASTIC_ENABLED:-false}
      ELASTIC_URL: ${ELASTIC_URL:-}
      TEST_ME_ENABLED: ${TEST_ME_ENABLED:-true}
      RULES_PATH: /etc/mysterio/rules.yaml
      PORT: ":8080"
    volumes:
      - ./configs/rules.yaml:/etc/mysterio/rules.yaml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: info
      # Used by provisioning/datasources/datasource.yml ($LOKI_USER / $LOKI_PASS)
      LOKI_USER: ${LOKI_USER:-}
      LOKI_PASS: ${LOKI_PASS:-}
    depends_on:
      - mysterio
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
